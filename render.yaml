services:
  # ─── Web Service (Express API) ──────────────────────────────────────────────
  - type: web
    name: prc-hardware-api
    env: node
    region: singapore # or oregon, frankfurt, etc.
    plan: free # or starter / standard
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:migrate:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: CLUSTER_MODE
        value: "false"
      - key: OSRM_FALLBACK_TO_HAVERSINE
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # ── SMTP (Brevo / any provider) ───────────────────────────────────────────
      # Set these values in Render Dashboard → Environment (never commit secrets)
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false          # fill in Render Dashboard
      - key: SMTP_PASS
        sync: false          # fill in Render Dashboard
      - key: SMTP_FROM_NAME
        value: PRC Hardware
      - key: SMTP_FROM_EMAIL
        value: ashaminbiswas1@gmail.com
      # ── Brevo HTTP API Key (bypasses SMTP port restrictions on Render) ───────
      - key: BREVO_API_KEY
        sync: false          # set in Render Dashboard (e.g. xkeysib-...)
      # ── Resend HTTP API Key (recommended #1 choice for production Node.js) ──
      - key: RESEND_API_KEY
        sync: false          # set in Render Dashboard (e.g. re_...)
      # ── Frontend URL (update to your deployed frontend domain) ────────────────
      - key: FRONTEND_URL
        sync: false          # e.g. https://your-frontend.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: prc-postgres
          property: connectionString
      # ── Redis (Upstash — Mumbai ap-south-1) ──────────────────────────────────
      # Set both values in Render Dashboard → Environment (never commit secrets)
      - key: UPSTASH_REDIS_REST_URL
        sync: false          # e.g. https://above-spider-196160.upstash.io
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false          # your Upstash REST token

databases:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  - name: prc-postgres
    region: singapore
    plan: free
    databaseName: prchardware
    user: prcuser
