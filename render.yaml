services:
  # ─── Web Service (Express API) ──────────────────────────────────────────────
  - type: web
    name: prc-hardware-api
    env: node
    region: singapore # or oregon, frankfurt, etc.
    plan: free # or starter / standard
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:migrate:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: CLUSTER_MODE
        value: "false"
      - key: OSRM_FALLBACK_TO_HAVERSINE
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prc-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: prc-redis
          property: connectionString

  # ─── Redis Cache & Job Queue Service ───────────────────────────────────────
  - type: redis
    name: prc-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  - name: prc-postgres
    region: singapore
    plan: free
    databaseName: prchardware
    user: prcuser
