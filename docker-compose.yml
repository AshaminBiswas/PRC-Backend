version: '3.8'

services:
  # ─── Pacific Hardware Node.js REST API Service ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prc-backend-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  # ─── Redis Container (100% Free Open-Source In-Memory Database) ──────────────
  redis:
    image: redis:7-alpine
    container_name: prc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
